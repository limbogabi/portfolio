<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jorge Mager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --text: #1a1d21;
        --body: #2c3138;
        --muted: #5c6570;
        --line: #d5dbe3;
        --accent: #2f5d7c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        background:
          radial-gradient(900px 480px at 50% -8%, #e4eaf1 0%, transparent 60%),
          linear-gradient(180deg, #f7f8fa 0%, #eef1f5 100%);
        color: var(--text);
        line-height: 1.65;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 3rem 1.5rem 3.5rem;
      }

      header {
        margin-bottom: 2.25rem;
        padding-bottom: 1.35rem;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        font-family: "Source Serif 4", Georgia, serif;
        font-size: clamp(1.9rem, 4vw, 2.35rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        margin: 0 0 0.4rem;
      }

      .tagline {
        color: var(--muted);
        font-style: italic;
        font-size: 1.05rem;
        margin: 0 0 1.15rem;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.85rem 1.35rem;
      }

      nav a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        padding-bottom: 1px;
        font-size: 1rem;
        font-weight: 500;
      }

      nav a:hover { border-color: var(--accent); }

      h2 {
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 1.15rem;
      }

      .contact-card {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1.5rem 1.75rem;
      }

      .photo {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        object-fit: cover;
        object-position: center 12%;
        border: 1px solid var(--line);
        box-shadow: 0 8px 24px rgba(26, 29, 33, 0.1);
        flex-shrink: 0;
      }

      .contact-details p {
        margin: 0 0 0.35rem;
        color: var(--body);
        font-size: 1.05rem;
      }

      .contact-details .label {
        color: var(--muted);
        font-size: 0.92rem;
        margin: 0.85rem 0 0.15rem;
      }

      .contact-details .label:first-child {
        margin-top: 0;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid #b7c9d6;
        padding-bottom: 1px;
      }

      a:hover { border-color: var(--accent); }

      footer {
        margin-top: 2.5rem;
        padding-top: 1.15rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Jorge Mager</h1>
        <p class="tagline">Automation Engineer · Applied Agentic AI</p>
        <nav>
          <a href="experience.html">Experience</a>
          <a href="projects.html">Projects</a>
          <a href="#contact">Contact</a>
        </nav>
      </header>

      <section id="contact">
        <h2>Contact</h2>
        <div class="contact-card">
          <img
            class="photo"
            src="assets/profile.png"
            alt="Jorge Mager"
          />
          <div class="contact-details">
            <p class="label">Email</p>
            <p>
              <a href="mailto:jorgemecher@gmail.com">jorgemecher@gmail.com</a>
            </p>
            <p class="label">Phone</p>
            <p>
              <a href="tel:+972524739307">052-473-9307</a>
            </p>
            <p class="label">LinkedIn</p>
            <p>
              <a href="https://www.linkedin.com/in/limbogabi/" target="_blank" rel="noopener noreferrer">linkedin.com/in/limbogabi</a>
            </p>
          </div>
        </div>
      </section>

      <footer>&copy; <span id="year"></span> Jorge Mager</footer>
    </main>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
